aid: mural-health
name: Mural Health
description: 'Mural Health is a clinical research technology company whose Mural Link platform manages
  the clinical trial participant experience end to end. Founded by the team that created ClinCard,
  Mural Health provides integrated participant payments across 10+ global methods (Venmo, PayPal,
  Zelle, Revolut, bank transfer, virtual and physical prepaid debit cards, and check via mail), in-app
  travel and rideshare coordination (Uber, Lyft), participant messaging and calendar syncing, and
  real-time satisfaction analytics for research sites and sponsors. The company works with leading
  pharmaceutical sponsors, CROs, and site networks to reduce trial dropout and administrative burden
  across studies in 75+ countries, and is backed by Bessemer Venture Partners. Mural Health does not
  currently publish a public API, developer portal, or SDKs; system integrations are delivered through
  partnerships (e.g., ClinOne, Clinical Ink).'
